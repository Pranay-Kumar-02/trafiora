[project]
name = "trafiora-api"
version = "0.1.0"
description = "Trafiora Database Workload Intelligence & Reliability Platform - Control Plane API"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [
    { name = "Trafiora Team", email = "dev@trafiora.io" }
]
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.10.0",
    "sqlglot>=26.0.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "psycopg[binary,pool]>=3.2.0",
    "aiosqlite>=0.20.0",
    "alembic>=1.14.0",
    "httpx>=0.28.0",
    "cryptography>=44.0.0",
    "python-multipart>=0.0.18",
    "numpy>=1.26.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
exclude = ["alembic/"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests/backend"]
python_files = "test_*.py"
markers = [
    "unit: Unit tests with isolated logic",
    "emulator: Wire-protocol emulator resilience tests",
    "real_postgres: Integration tests executing against a real PostgreSQL engine",
    "benchmark: Performance benchmark workloads",
]

