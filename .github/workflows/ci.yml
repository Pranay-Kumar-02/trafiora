name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  backend-test:
    name: Backend Tests & Real PostgreSQL Integration
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python 3.12
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Start PostgreSQL 18 with pg_stat_statements
        run: |
          docker run -d \
            --name trafiora-postgres \
            -p 5432:5432 \
            -e POSTGRES_USER=trafiora_tester \
            -e POSTGRES_PASSWORD=trafiora_test_password \
            -e POSTGRES_DB=trafiora_test_db \
            postgres:18 \
            -c shared_preload_libraries=pg_stat_statements \
            -c pg_stat_statements.track=all

      - name: Wait for PostgreSQL readiness and initialize extensions
        run: |
          echo "Waiting for PostgreSQL engine to be ready..."
          for i in $(seq 1 60); do
            if docker exec trafiora-postgres psql -U trafiora_tester -d postgres -c "SELECT 1" >/dev/null 2>&1; then
              docker exec trafiora-postgres psql -U trafiora_tester -d postgres -c "CREATE DATABASE trafiora_test_db;" >/dev/null 2>&1 || true
            fi
            if docker exec trafiora-postgres psql -U trafiora_tester -d trafiora_test_db -c "SELECT 1" >/dev/null 2>&1; then
              echo "PostgreSQL is ready and database trafiora_test_db is accessible."
              break
            fi
            echo "Waiting for database initialization... ($i/60)"
            sleep 1
          done
          echo "Enabling pg_stat_statements extension on real engine..."
          docker exec trafiora-postgres psql -U trafiora_tester -d trafiora_test_db -c "CREATE EXTENSION IF NOT EXISTS pg_stat_statements;"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r apps/api/requirements.txt
          pip install pytest pytest-asyncio httpx sqlglot psutil

      - name: Run Backend Unit & Real PostgreSQL Integration Tests
        env:
          TEST_POSTGRES_HOST: 127.0.0.1
          TEST_POSTGRES_PORT: 5432
          TEST_POSTGRES_USER: trafiora_tester
          TEST_POSTGRES_PASSWORD: trafiora_test_password
          TEST_POSTGRES_DB: trafiora_test_db
        run: |
          python -m pytest tests/backend -v

      - name: Cleanup PostgreSQL container
        if: always()
        run: |
          docker stop trafiora-postgres || true
          docker rm -f trafiora-postgres || true

  frontend-build:
    name: Frontend Lint, Typecheck & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Node.js 22
        uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: apps/web/package.json

      - name: Install frontend dependencies
        working-directory: apps/web
        run: npm install

      - name: Run ESLint
        working-directory: apps/web
        run: npm run lint

      - name: Typecheck Next.js application
        working-directory: apps/web
        run: npm run typecheck

      - name: Build Next.js application
        working-directory: apps/web
        run: npm run build
