services:
  test-postgres:
    image: postgres:18.6-alpine
    container_name: trafiora-test-pg
    command: >
      postgres
      -c shared_preload_libraries=pg_stat_statements
      -c pg_stat_statements.max=10000
      -c pg_stat_statements.track=top
    environment:
      POSTGRES_USER: test_user
      POSTGRES_PASSWORD: test_password
      POSTGRES_DB: trafiora_test
    ports:
      - "5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U test_user -d trafiora_test"]
      interval: 3s
      timeout: 3s
      retries: 5
