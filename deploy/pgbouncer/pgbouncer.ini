[databases]
target_app_db = host=target-disposable-db port=5432 dbname=target_app_db

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432
auth_type = scram-sha-256
auth_file = /etc/pgbouncer/userlist.txt
pool_mode = transaction
max_client_conn = 500
default_pool_size = 25
min_pool_size = 5
reserve_pool_size = 5
reserve_pool_timeout = 5.0
max_db_connections = 50
server_idle_timeout = 600.0
client_idle_timeout = 0.0
log_connections = 1
log_disconnections = 1
log_pooler_errors = 1
stats_period = 60
